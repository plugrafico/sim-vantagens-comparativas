<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Simulação Econômica: Dinâmicas de Comércio</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- Chart.js para renderizar as curvas de produção -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Simulador de Dinâmica Econômica</h1>
        <div id="country-selector">
            <button onclick="ui.selectCountry('A')">Assumir País A (Agrário)</button>
            <button onclick="ui.selectCountry('B')">Assumir País B (Industrial)</button>
        </div>
    </header>

    <main id="app" style="display:none;">
        <section id="dashboard">
            <div class="stats-card">
                <h2 id="country-name">País</h2>
                <p id="country-desc"></p>
                <div id="costs-display">
                    <p>Custo Trigo: <span id="cost-wheat"></span> UM</p>
                    <p>Custo Aço: <span id="cost-steel"></span> UM</p>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="productionChart"></canvas>
            </div>
        </section>

        <section id="trade-sim">
            <h3>Cenário de Mundo: Isolamento vs. Comércio</h3>
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Mundo 1 (Isolado)</th>
                        <th>Mundo 2 (Comércio)</th>
                    </tr>
                </thead>
                <tbody id="comparison-body">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
            <button id="trade-btn" onclick="engine.runTradeSimulation()">Simular Comércio Internacional</button>
        </section>
    </main>

    <script src="assets/js/engine.js"></script>
    <script src="assets/js/ui.js"></script>
</body>
</html>
