<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Fronteiras de Produção</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Dinâmicas Econômicas: Países A e B</h1>
        <p>Selecione um país para começar o exercício</p>
        <div id="country-selector">
            <button onclick="ui.selectCountry('A')">Assumir País A (Trigo: 2 | Aço: 6)</button>
            <button onclick="ui.selectCountry('B')">Assumir País B (Trigo: 3 | Aço: 4)</button>
        </div>
    </header>

    <main id="app" style="display:none; padding: 20px;">
        <div id="dashboard">
            <div class="stats-card">
                <h2 id="country-name"></h2>
                <p id="country-desc" style="font-style: italic;"></p>
                <div id="costs-display">
                    <p>Custo de Produção Doméstica:</p>
                    <ul>
                        <li>1 Ton Trigo: <strong id="cost-wheat"></strong> UM</li>
                        <li>1 Ton Aço: <strong id="cost-steel"></strong> UM</li>
                    </ul>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="productionChart"></canvas>
            </div>
        </div>

        <div id="trade-sim" style="margin-top: 30px; border-top: 2px solid #ccc; padding-top: 20px;">
            <h3>Simulação de Mundo 2: Comércio Internacional</h3>
            <p>Objetivo: Consumir 10 Ton de Trigo e 8 Ton de Aço.</p>
            <button onclick="engine.runTradeSimulation()" style="padding: 10px 20px; cursor: pointer;">Calcular Ganhos de Troca</button>
            
            <table>
                <thead>
                    <tr>
                        <th>Métrica</th>
                        <th>Mundo 1 (Isolado)</th>
                        <th>Mundo 2 (Comércio)</th>
                    </tr>
                </thead>
                <tbody id="comparison-body">
                    <!-- Dados inseridos pelo engine.js -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="assets/js/engine.js"></script>
    <script src="assets/js/ui.js"></script>
</body>
</html>
